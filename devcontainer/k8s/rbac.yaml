# Read-only cluster identity for the devcontainer. Apply against your real
# k3s cluster (not from inside the devcontainer — it has no cluster access
# until this exists): `kubectl apply -f devcontainer/k8s/rbac.yaml`.
#
# Targets the Henia project cluster on tachiko (88.99.160.8). This is the
# concrete form of FR-085: the framework can read the state of the running
# platform without being able to change it.
#
# Binds to the built-in `view` ClusterRole, which grants get/list/watch on
# most objects cluster-wide but deliberately excludes Secret *contents* —
# the devcontainer can see that a Secret exists, not read it. Deploys happen
# via git and a reconciler watching the repo; this identity is read-back only.
#
# No verb outside get/list/watch appears anywhere in this file. That is the
# invariant worth checking on every edit.
apiVersion: v1
kind: Namespace
metadata:
  name: claude-devcontainer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-devcontainer
  namespace: claude-devcontainer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-devcontainer-view
subjects:
  - kind: ServiceAccount
    name: claude-devcontainer
    namespace: claude-devcontainer
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# `view` only grants read access to namespaced resources — StorageClass and
# IngressClass are cluster-scoped (the same reason `nodes` is forbidden under
# plain `view`), so they need their own explicit grant. Still get/list/watch
# only. This lets the devcontainer independently confirm substrate facts —
# that local-path is the default StorageClass, that a default IngressClass
# exists — instead of taking the operator's word for it.
#
# The previous revision of this file also granted Argo CD resources
# (applications, appprojects, applicationsets) and cert-manager
# ClusterIssuers. Both were dropped when this identity moved to tachiko:
# neither component is installed on this cluster, and a grant for an absent
# API group is dead configuration that outlives the reason for it.
#
# Recorded because review finding F7 flagged it: the devserver-setup plan
# authorised removing the Argo CD grants and said nothing about the
# cert-manager one, so that second removal was undeclared. It stands, but
# note the consequence — when cert-manager is installed, restore the
# ClusterIssuer grant here, or the devcontainer will be unable to confirm
# that a ClusterIssuer exists and will have to take the operator's word for
# it, which is the exact failure this file's cluster-scoped grants exist to
# prevent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-devcontainer-cluster-scoped-view
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-devcontainer-cluster-scoped-view
subjects:
  - kind: ServiceAccount
    name: claude-devcontainer
    namespace: claude-devcontainer
roleRef:
  kind: ClusterRole
  name: claude-devcontainer-cluster-scoped-view
  apiGroup: rbac.authorization.k8s.io
