# Authorises Prometheus to read the operator's metrics (cluster-substrate
# phase 7 / FR-270).
#
# The operator's metrics endpoint keeps kubebuilder's default authn/authz -
# relaxing it would have reopened the previous change's most severe finding one
# change later, inside the cluster instead of outside it. So Prometheus presents
# its own ServiceAccount token, and this binding is what makes that token
# sufficient: henia-metrics-reader is generated by kubebuilder and applied from
# config/rbac, and it grants nothing but GET on /metrics.
#
# Tracked here because it was not. Implementation review F5 found this binding
# existing only in the cluster while the scrape config beside it asserted, in a
# comment, that it existed - the exact drift the change's own Implementation
# Approach said would be stated rather than assumed. Read back off the running
# cluster on 2026-08-20 and committed verbatim.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-henia-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: henia-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-server
    namespace: monitoring
