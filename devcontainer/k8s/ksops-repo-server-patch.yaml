# Strategic merge patch for the shared argocd-repo-server Deployment.
# Apply per the steps in enable-ksops.md — not applied automatically, and
# not applicable from the devcontainer's read-only identity.
#
# Pin the image tag to whatever's current at apply time; check
# https://github.com/viaductoss/ksops for the latest release and confirm
# these mount paths still match its documented Argo CD integration.
spec:
  template:
    spec:
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.3.2
          command: ["/bin/sh", "-c"]
          args:
            - echo "Installing KSOPS...";
              mv ksops /custom-tools/;
              mv kustomize /custom-tools/;
              echo "Done.";
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
      containers:
        - name: argocd-repo-server
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
          volumeMounts:
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops
            - mountPath: /usr/local/bin/kustomize
              name: custom-tools
              subPath: kustomize
            - mountPath: /.config/sops/age/keys.txt
              name: sops-age
              subPath: keys.txt
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
