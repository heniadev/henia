# Telemetry collector for FR-270: the framework publishes its own operational
# telemetry for an external collector to read. Nothing Henia-specific is
# emitted yet - this makes the collector exist and proves it scrapes.
#
# The plain prometheus chart is used rather than kube-prometheus-stack: its
# default scrape config already covers kubernetes-apiservers and the kubelet,
# which is exactly what this phase must demonstrate, without the operator,
# CRDs and Grafana that the stack would drag onto a box whose dominant risk
# is resource contention.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: prometheus
  version: 29.27.0
  targetNamespace: monitoring
  createNamespace: true
  valuesContent: |-
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    prometheus-node-exporter:
      enabled: true
    server:
      retention: 15d
      persistentVolume:
        enabled: true
        storageClass: local-path
        size: 20Gi
      ingress:
        enabled: true
        ingressClassName: haproxy
        # Review finding F1: without this the collector was world-readable,
        # exposing 1538 metric names and Secret names/namespaces to anyone.
        # Enforced by the ingress controller, so it is unaffected by DNAT and
        # by nftables reloads. The referenced Secret is created out-of-band and
        # is deliberately NOT tracked in git.
        annotations:
          haproxy.org/auth-type: "basic-auth"
          haproxy.org/auth-secret: "monitoring/prometheus-basic-auth"
        hosts:
          - prometheus.tachiko.kondi.net
