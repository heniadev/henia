---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - henia.dev
  resources:
  - herds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - henia.dev
  resources:
  - herds/finalizers
  verbs:
  - update
- apiGroups:
  - henia.dev
  resources:
  - herds/status
  verbs:
  - get
  - patch
  - update
