# Build pipeline for the Henia operator (cluster-substrate phase 5).
#
# Clones this repository, builds the kubebuilder-generated Dockerfile with
# BuildKit in ROOTLESS mode, and pushes to the in-cluster Harbor.
#
# BuildKit rather than kaniko: kaniko was archived in 2025 with no patches
# since, and it holds registry push credentials and reads your source. BuildKit
# is maintained, consumes the same generated Dockerfile, and runs unprivileged.
#
# Started by hand — there is no webhook and no Trigger. Auto-deploy-on-merge is
# S-03 `checks-and-reconcile`, not this change.
---
# The identity PipelineRuns run under. Tracked because it carries no secret
# VALUES — only the names of two Secrets created out-of-band (see README.md):
# `gitea-auth` for the clone and `harbor-push` for the push.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-build
  namespace: default
secrets:
  - name: gitea-auth
imagePullSecrets:
  - name: harbor-push
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: henia-build-workspace
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: henia-operator-build
  namespace: default
spec:
  params:
    - name: revision
      type: string
      description: >-
        Git revision to build. NOT defaulted to the repository's default branch
        on purpose: while a change is in flight the operator source lives on its
        feature branch, and a clone with no ref would build a tree containing no
        operator — failing as though the Dockerfile were broken. Switch this to
        main once the change merges.
    - name: image
      type: string
      description: >-
        Image repository WITHOUT a tag. The tag is derived from the revision the
        pipeline actually cloned, not supplied by the caller: a caller computing
        the short SHA from their own working copy tags the image with a commit
        the pipeline never built. Review finding F9.
    - name: runId
      type: string
      description: >-
        Identifier of the run, used to give each PipelineRun its own tree on
        the shared workspace. The Pipeline passes $(context.pipelineRun.name).
  results:
    - name: commit
      description: Short commit SHA of the revision actually cloned.
    - name: image
      description: Fully qualified image reference, including the derived tag.
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.49.0
      script: |
        #!/bin/sh
        set -eu
        # The credential never enters the URL. Interpolating it into
        # https://user:pass@host put it in git's argv (readable through /proc
        # by anything in this pod), in git's own error messages on failure, and
        # persisted it as remote.origin.url in .git/config on the node's shared
        # PVC. Review finding F6.
        #
        # git's `store` helper rather than GIT_ASKPASS, and the reason matters:
        # the password in `gitea-auth` is stored PERCENT-ENCODED. The inline URL
        # worked only because git decodes userinfo, so an askpass helper - which
        # hands the value over literally - authenticated with the wrong string
        # and failed. The store helper parses each line as a URL and decodes it
        # the same way, so it works with the secret exactly as it is stored.
        # The credentials file lives in this pod's own filesystem and dies with
        # it; it never reaches the shared workspace.
        # Subshell, so the restrictive umask dies with the file it is for. Left
        # to leak, it also applied to the Tekton result files written at the end
        # of this step, which the rootless build step then could not read -
        # "cat: can't open '/tekton/results/image': Permission denied".
        ( umask 077
          printf 'https://%s:%s@git.tobiko.kondi.net\n' \
            "$(cat /gitea/username)" "$(cat /gitea/password)" > "$HOME/.git-credentials" )
        git config --global credential.helper store
        export GIT_TERMINAL_PROMPT=0

        # One tree per PipelineRun. A single fixed path meant a second run's
        # rm -rf deleted the first run's source mid-build, and the first run
        # then failed with a corrupted-tree error that read like a Dockerfile
        # fault. Review finding F7. Trees older than three days are pruned so
        # the workspace does not grow without bound; three days is longer than
        # any run, so a concurrent run is never the one pruned.
        DEST="$(workspaces.source.path)/$(params.runId)/repo"
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -type d \
             -mtime +3 -exec rm -rf {} + 2>/dev/null || true
        rm -rf "$DEST"
        mkdir -p "$(dirname "$DEST")"
        git clone --depth 1 --branch "$(params.revision)" \
          "https://git.tobiko.kondi.net/kondi/henia.git" "$DEST"
        cd "$DEST"
        SHA="$(git rev-parse --short HEAD)"
        echo "cloned $(params.revision) at $SHA"
        printf '%s' "$SHA" > "$(results.commit.path)"
        printf '%s:%s' "$(params.image)" "$SHA" > "$(results.image.path)"
      volumeMounts:
        - name: gitea
          mountPath: /gitea
          readOnly: true
    - name: build-and-push
      image: moby/buildkit:v0.32.2-rootless
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        # Rootless BuildKit still needs these two relaxed to create user
        # namespaces. Unprivileged is not the same as unconstrained: the pod
        # does NOT get privileged: true, and that distinction is what phase 5's
        # criterion asserts.
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      env:
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox
        - name: DOCKER_CONFIG
          value: /home/user/.docker
      script: |
        #!/bin/sh
        set -eu
        mkdir -p /home/user/.docker
        cp /harbor/.dockerconfigjson /home/user/.docker/config.json
        IMAGE="$(cat "$(results.image.path)")"
        echo "building $IMAGE"
        cd "$(workspaces.source.path)/$(params.runId)/repo"
        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --output type=image,name="$IMAGE",push=true,registry.insecure=true
      volumeMounts:
        - name: harbor
          mountPath: /harbor
          readOnly: true
  volumes:
    - name: gitea
      secret:
        secretName: gitea-auth
    - name: harbor
      secret:
        secretName: harbor-push
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: henia-operator
  namespace: default
spec:
  params:
    - name: revision
      type: string
    - name: image
      type: string
  workspaces:
    - name: source
  results:
    - name: image
      description: The image reference actually built, tag included.
      value: $(tasks.build.results.image)
  tasks:
    - name: build
      taskRef:
        name: henia-operator-build
      params:
        - name: revision
          value: $(params.revision)
        - name: image
          value: $(params.image)
        - name: runId
          value: $(context.pipelineRun.name)
      workspaces:
        - name: source
          workspace: source
