# Telemetry collector for FR-270: the framework publishes its own operational
# telemetry for an external collector to read. Nothing Henia-specific is
# emitted yet - this makes the collector exist and proves it scrapes.
#
# The plain prometheus chart is used rather than kube-prometheus-stack: its
# default scrape config already covers kubernetes-apiservers and the kubelet,
# which is exactly what this phase must demonstrate, without the operator,
# CRDs and Grafana that the stack would drag onto a box whose dominant risk
# is resource contention.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: prometheus
  version: 29.27.0
  targetNamespace: monitoring
  createNamespace: true
  valuesContent: |-
    extraScrapeConfigs: |
      # Henia operator metrics (cluster-substrate phase 7 / FR-270).
      #
      # A static job rather than the annotation-driven kubernetes-service-endpoints
      # discovery, because kubebuilder v4 serves metrics behind authn/authz and that
      # job cannot attach a per-target bearer token. The protection is deliberately
      # NOT relaxed: the previous change's most severe finding was an
      # unauthenticated metrics surface, and turning authn off here would reopen
      # that class one change later. Prometheus authenticates with its own
      # ServiceAccount token, authorised by the henia-metrics-reader ClusterRole.
      - job_name: henia-operator
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [henia-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: henia-controller-manager-metrics-service
            action: keep
          # Keep ONLY the Service's named port. The endpoints role also
          # discovers every declared container port that is not bound to an
          # endpoint port, so the operator's :8081 health port arrived as a
          # second target - scraped over https because the job says https,
          # answered in plain HTTP because health is not the metrics endpoint,
          # and permanently down. The Service exposes 8443 alone; targets
          # invented from container ports carry no endpoint port name.
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: https
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    prometheus-node-exporter:
      enabled: true
    server:
      retention: 15d
      persistentVolume:
        enabled: true
        storageClass: local-path
        size: 20Gi
      ingress:
        enabled: true
        ingressClassName: haproxy
        # Review finding F1: without this the collector was world-readable,
        # exposing 1538 metric names and Secret names/namespaces to anyone.
        # Enforced by the ingress controller, so it is unaffected by DNAT and
        # by nftables reloads. The referenced Secret is created out-of-band and
        # is deliberately NOT tracked in git.
        annotations:
          haproxy.org/auth-type: "basic-auth"
          haproxy.org/auth-secret: "monitoring/prometheus-basic-auth"
        hosts:
          - prometheus.tachiko.kondi.net
