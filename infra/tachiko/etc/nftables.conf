#!/usr/sbin/nft -f
# Host perimeter for the Henia project cluster (tachiko).
#
# Policy, per context/changes/devserver-setup/plan.md phase 2:
#   - SSH (22) is open to the world by operator decision; it is also the
#     recovery path if the 6443 rules are ever wrong.
#   - The k3s API (6443) is reachable only from AS12912 announced prefixes.
#     Wide by design; narrowing is roadmap debt item D-01.
#   - forward is left to k3s: the CNI installs its own rules, and a drop
#     policy here would silently break pod networking.

# NOT `flush ruleset`: that flushes every table in every family, including the
# iptables-nft KUBE-* tables kube-proxy owns. Reloading with it destroys k3s
# service NAT (observed: KUBE-EXT rules 30 -> 0, ingress down, no kube-proxy
# resync, recovery only via `systemctl restart k3s`). Scope the reset to our
# own table. Review finding F8.
table inet filter
delete table inet filter

table inet filter {
	set as12912_v4 {
		type ipv4_addr
		flags interval
		auto-merge
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept comment "loopback"
		ct state established,related accept
		ct state invalid drop

		meta l4proto { icmp, ipv6-icmp } accept comment "diagnostics and PMTUD"

		tcp dport 22 accept comment "SSH - world-open by decision"
		tcp dport { 80, 443 } ip saddr @as12912_v4 accept comment "ingress - AS12912 only (F1: was world-open, exposed unauthenticated Prometheus)"
		tcp dport 6443 ip saddr @as12912_v4 accept comment "k3s API - AS12912 only"

		# k3s cluster-internal traffic. Present ahead of the install so the
		# cluster is not brought up behind a policy that silently drops it.
		iifname { "cni0", "flannel.1", "cilium_host" } accept comment "CNI interfaces"

		counter comment "dropped by policy"
	}

	chain forward {
		type filter hook forward priority filter; policy accept;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables.d/as12912.nft"
